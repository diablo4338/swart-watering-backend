openapi: 3.0.3
info:
  title: Smart Watering MCU API
  version: 1.0.0
  description: Local HTTP API exposed by ESP32-C3 smart-watering controllers.
servers:
  - url: http://{controller_ip}
    variables:
      controller_ip:
        default: 192.168.1.50
paths:
  /healthz:
    get:
      summary: Check whether the controller HTTP server is alive
      responses:
        "200":
          description: Controller is awake
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /metrics:
    get:
      summary: Return text weight metrics
      responses:
        "200":
          description: Weight metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  useful_weight_g 83
                  gross_weight_g 533
  /constants:
    get:
      summary: Return compile-time MCU constants and selected runtime calibration values
      responses:
        "200":
          description: Constants returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstantsResponse"
  /watering:
    get:
      summary: Return current device, watering, config and weight state
      responses:
        "200":
          description: Current controller state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
  /config:
    post:
      summary: Partially update controller config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRequest"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: config_updated
        "400":
          $ref: "#/components/responses/Error"
  /watering/start:
    post:
      summary: Start watering on a tank device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WateringStartRequest"
      responses:
        "200":
          description: Watering accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: accepted
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /watering/stop:
    post:
      summary: Stop active watering or succeed as a no-op
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Stop requested or no active watering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                stopRequested:
                  value:
                    status: stop_requested
                noActiveWatering:
                  value:
                    status: no_active_watering
        "400":
          $ref: "#/components/responses/Error"
  /sleep/enable:
    post:
      summary: Enable deep sleep
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Deep sleep enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: sleep_enabled
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sleep/disable:
    post:
      summary: Disable deep sleep
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Deep sleep disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: sleep_disabled
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sleep/interval:
    post:
      summary: Update deep sleep wake interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SleepIntervalRequest"
      responses:
        "200":
          description: Sleep interval updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: sleep_interval_updated
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /zero:
    post:
      summary: Capture current raw HX711 sample as zero
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Zero captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: zero_captured
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /calibration:
    post:
      summary: Calibrate HX711 scale coefficient from a known weight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationRequest"
      responses:
        "200":
          description: Scale calibrated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: calibrated
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /operations/callback:
    post:
      summary: Operation callback endpoint exposed by the backend, not the MCU
      description: Controllers post callbacks to this backend endpoint when callback_url is supplied.
      servers:
        - url: http://192.0.2.10:8080
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationCallback"
      responses:
        "200":
          description: Callback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              example:
                status: recorded
        "400":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OperationRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          example: 7a5c5f9e-d909-470f-ae20-46a72b0dbf9d
        callback_url:
          type: string
          format: uri
          example: http://192.0.2.10:8080/operations/callback
    ConfigRequest:
      allOf:
        - $ref: "#/components/schemas/OperationRequest"
        - type: object
          minProperties: 1
          properties:
            device_type:
              $ref: "#/components/schemas/DeviceType"
            name:
              type: string
              minLength: 1
              maxLength: 31
              example: plant_1
            tare_weight_g:
              type: number
              format: float
              minimum: 0
              example: 450
            dry_weight_g:
              type: number
              format: float
              minimum: 0
              example: 120
    WateringStartRequest:
      allOf:
        - $ref: "#/components/schemas/OperationRequest"
        - type: object
          required:
            - target_g
          properties:
            target_g:
              type: number
              format: float
              exclusiveMinimum: true
              minimum: 0
              description: Target poured mass in grams.
              example: 120
    SleepIntervalRequest:
      allOf:
        - $ref: "#/components/schemas/OperationRequest"
        - type: object
          required:
            - minutes
          properties:
            minutes:
              type: integer
              minimum: 1
              maximum: 50
              example: 20
    CalibrationRequest:
      allOf:
        - $ref: "#/components/schemas/OperationRequest"
        - type: object
          required:
            - weight_g
          properties:
            weight_g:
              type: number
              format: float
              exclusiveMinimum: true
              minimum: 0
              description: Known mass placed on the scale in grams.
              example: 500
    OperationCallback:
      type: object
      required:
        - operation_id
        - status
      properties:
        operation_id:
          type: string
          format: uuid
          example: 7a5c5f9e-d909-470f-ae20-46a72b0dbf9d
        status:
          type: string
          enum:
            - queued
            - created
            - received
            - accepted
            - send
            - sent
            - started
            - start
            - completed
            - complete
            - ok
            - timeout
            - failed
            - failure
            - error
          example: completed
        detail:
          type: string
          example: target_reached
    DeviceStatus:
      type: object
      required:
        - device
        - watering
        - config
        - weight
      properties:
        device:
          type: object
          required:
            - type
            - name
          properties:
            type:
              $ref: "#/components/schemas/DeviceType"
            name:
              type: string
              example: plant_1
        watering:
          type: object
          required:
            - active
            - state
            - last_operation_type
            - last_operation_status
          properties:
            active:
              type: boolean
            state:
              type: string
              enum:
                - waiting
                - watering
            last_operation_type:
              type: string
              enum:
                - none
                - start
                - stop
                - config
                - sleep
                - zero
                - calibration
            last_operation_status:
              type: string
              enum:
                - none
                - in_progress
                - completed
                - stopped
                - failed
        config:
          type: object
          required:
            - target_g
            - tare_weight_g
            - dry_weight_g
            - zero_raw
            - raw_per_gram
            - sleep_disabled
            - sleep_interval_min
          properties:
            target_g:
              type: number
              format: float
            tare_weight_g:
              type: number
              format: float
            dry_weight_g:
              type: number
              format: float
            zero_raw:
              type: integer
            raw_per_gram:
              type: number
              format: float
            sleep_disabled:
              type: boolean
            sleep_interval_min:
              type: integer
              minimum: 1
              maximum: 50
        weight:
          type: object
          required:
            - useful_weight_g
            - gross_weight_g
            - water_used_g
          properties:
            useful_weight_g:
              type: number
              format: float
            gross_weight_g:
              type: number
              format: float
            water_used_g:
              type: number
              format: float
    ConstantsResponse:
      type: object
      required:
        - pins
        - weight
        - filtering
        - watering
        - sleep
        - ui
        - runtime
      properties:
        pins:
          type: object
          properties:
            hx711_dout_pin:
              type: integer
            hx711_sck_pin:
              type: integer
            status_led_pin:
              type: integer
            start_pin:
              type: integer
        weight:
          type: object
          properties:
            default_offset_raw:
              type: integer
            default_raw_per_gram:
              type: number
              format: float
            read_samples:
              type: integer
            read_interval_ms:
              type: integer
            zero_deadband_g:
              type: number
              format: float
            weight_buffer_size:
              type: integer
            default_tare_weight_g:
              type: number
              format: float
            tare_tolerance_g:
              type: number
              format: float
        filtering:
          type: object
          properties:
            anomaly_threshold_g:
              type: number
              format: float
            anomaly_confirm_count:
              type: integer
            max_raw_jump:
              type: integer
        watering:
          type: object
          properties:
            control_start_delay_ms:
              type: integer
            control_interval_ms:
              type: integer
            stopped_change_threshold_g:
              type: number
              format: float
            stopped_change_detect_window_ms:
              type: integer
        sleep:
          type: object
          properties:
            default_deep_sleep_wakeup_interval_min:
              type: integer
            min_deep_sleep_wakeup_interval_min:
              type: integer
            max_deep_sleep_wakeup_interval_min:
              type: integer
            wifi_online_window_ms:
              type: integer
        ui:
          type: object
          properties:
            led_blink_ms:
              type: integer
        runtime:
          type: object
          properties:
            zero_raw:
              type: integer
            raw_per_gram:
              type: number
              format: float
    DeviceType:
      type: string
      enum:
        - plant
        - tank
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - accepted
            - calibrated
            - config_updated
            - no_active_watering
            - sleep_disabled
            - sleep_enabled
            - sleep_interval_updated
            - stop_requested
            - zero_captured
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - calibration_failed
            - config_update_failed
            - device_not_tank
            - empty_config
            - invalid_calibration_weight_g
            - invalid_device_type
            - invalid_dry_weight_g
            - invalid_name
            - invalid_sleep_interval
            - invalid_target_g
            - invalid_tare_weight_g
            - no_memory
            - read_failed
            - sleep_disable_failed
            - sleep_enable_failed
            - sleep_interval_update_failed
            - task_create_failed
            - watering_already_active
            - watering_start_failed
            - zero_capture_failed
